# Siden ligger på support.kvh.no/kvhui/. NetBird-proxyen kan sende stien med eller
# uten prefikset, så begge deler serveres fra samme mappe. Alle filene i siden
# bruker RELATIVE adresser av samme grunn.
#
# CSP er stram med vilje: siden kjører på samme opprinnelse som Zammad, så en
# XSS her er det samme som å stjele en agents innlogging. Ingen innebygde
# skript, ingen eksterne skript. Siden kan KUN legges i en ramme av RMM-et
# (frame-ancestors). X-Frame-Options er fjernet: den kan bare si «nei» eller «samme
# opprinnelse», ikke «bare rmm.kvh.no», og ville blokkert rammen.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'none'; frame-ancestors https://rmm.kvh.no; base-uri 'none'; form-action 'none'" always;
  # Nettleseren skal ALLTID spørre om det finnes en nyere fil (billig, den får 304 hvis ikke). Uten dette
  # kunne den holde på gammel JavaScript i timevis etter en utrulling: en kollega så «sperret i prøvemodus»
  # lenge etter at sperren var fjernet.
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /kvhui/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /kvhui/index.html;
  }
  location = /kvhui { return 301 /kvhui/; }
  location / {
    try_files $uri $uri/ /index.html;
  }
  location = /helse { access_log off; default_type text/plain; return 200 "ok\n"; }
}
