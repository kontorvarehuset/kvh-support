name: Bygg bilde
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kontorvarehuset/kvh-support:latest
            ghcr.io/kontorvarehuset/kvh-support:${{ github.sha }}
